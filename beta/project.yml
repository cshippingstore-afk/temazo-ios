name: TemazoBeta
options:
  bundleIdPrefix: es.temazo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: '16.0'

settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: 4B8U4JJQ93
    MARKETING_VERSION: '1.2.41'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # v1.2.41: paridad total con web para el sistema de importaciones:
    # (1) ImportsScreen auto-refresca cada 20s si hay items pending/searching/
    #     importing (mientras la pantalla siga abierta).
    # (2) NotificationsScreen maneja 2 kinds nuevos: import_artist_done abre
    #     ArtistScreen, import_track_done reproduce el track. Extrae "name"
    #     del payload JSON para el texto ("Ya tenemos a X en Temazo").
    # (3) NoResultsWithImportCta detecta " - "/"–"/"—" en la query y ofrece
    #     dos botones (Artista + Cancion) cuando aplica; también mapea
    #     NSError.code=429 → .rateLimited.
    # Backend: _phase_process_imports.py inserta fila en user_notifications
    # (kind=import_artist_done / import_track_done) cuando un import completa,
    # ademas del email actual — cero cambio de esquema.
    # v1.2.40: VUELTA al modelo DISCRETO del player (peticion explicita del user).
    # Mini abajo o Full arriba, sin estados intermedios continuos. Se elimina
    # dragDelta + commitDragSnap + visibleExpandProgress. MiniPlayer y FullPlayer
    # NO se tocan: sus callbacks onDragToExpand/onDragToCollapse/onDragEnded son
    # opcionales, si se pasan nil usan comportamiento discreto ya existente
    # (swipe up >80pt -> onExpand, swipe down >140pt -> onClose). La animacion
    # spring del cambio expandProgress 0<->1 la hace .animation(spring, value:
    # expandProgress) sobre el FullPlayer. Los gestos horizontales next/prev
    # siguen funcionando (v1.2.39 los tenia en simultaneousGesture aparte).
    # v1.2.39: gestos completos + fluidos - dos simultaneousGesture separados:
    # uno VERTICAL (drag continuo collapse/expand) y otro HORIZONTAL (next/prev al
    # soltar). No compiten entre si (una direccion cada uno) ni interfieren con
    # slider/botones internos. Restaura next/prev que se rompio en v1.2.38.
    # v1.2.38: fix real trompicones al cerrar FullPlayer - .simultaneousGesture()
    # en vez de .gesture() para que el drag NO compita con gestos internos
    # (botones play/pause, slider progreso, cover tap). Antes cada vez que el
    # dedo pasaba por encima de un boton, el drag se cortaba y saltaba.
    # v1.2.37: player drag hacia abajo tambien suave. Bug: el check direccional
    # (abs h > abs w) se evaluaba cada frame → gestos ligeramente diagonales
    # oscilaban entre pasa/no-pasa → dragDelta se congelaba y saltaba (trompicones).
    # Fix: @GestureState dragDirection decidida al start (primer frame >8pt) y
    # MANTENIDA todo el gesto. Aplicado a MiniPlayer (subir) + FullPlayer (bajar)
    # para paridad. Ahora ambas direcciones fluidas siguiendo el dedo.
    # v1.2.36: player suave sin escalones - Transaction(disablesAnimations=true) en
    # dragDelta setter + .animation(nil, value: dragDelta) para NO animar cambios
    # del drag continuo (60fps sigue el dedo instantaneo). .animation(spring, value:
    # expandProgress) mantiene el snap suave al soltar. Avatar artista 44pt + tap
    # area extendida 56pt para tocar mas facil.
    # v1.2.35: FIX CRITICO player - offset volver a screenHeight (v1.2.32 uso
    # travelDistance que dejaba ~144pt del top FullPlayer visible al progress=0
    # -> bloqueaba interaccion). Ahora al progress=0 FullPlayer completamente
    # fuera de pantalla. Import iOS confirmado funcional con JSON body en curl.
    # v1.2.34: fix 2 bugs criticos - (1) requestImport enviaba form-urlencoded pero
    # endpoint espera JSON body (json_decode de php://input) -> "bad_request";
    # ahora se envia JSON. (2) FullPlayer quedaba semi-abierto al navegar a
    # playlist/artist; ahora onChange(detailStack.count | tab) fuerza collapse.
    # v1.2.33: paridad con Android 1.0.6 — botón "Solicitar" en busqueda cuando no
    # se encuentra artista + al final de resultados si no hay match exacto +
    # no-cache en search/my_imports para que aparezca inmediato tras el email
    # v1.2.32: Player Spotify TRUE - emerge DESDE el mini (no fondo screen). Offset
    # va de travelDistance (top FullPlayer = top mini) a 0 (fullscreen). Divisor de
    # drag = travelDistance para proporcion 1:1 con el dedo. Mini + nav se ocultan
    # sincronizados al mismo drag.
    # v1.2.31: Player FIX 3 problemas simultaneos: (1) salto al soltar - consolidar
    # dragDelta en expandProgress antes de animar (offset visible no cambia en el
    # transfer); (2) rebote - damping 0.95 sin oscilacion; (3) atasco - quitar
    # allowsHitTesting condicional que interrumpia el gesture al cruzar 0.5
    # v1.2.30: Player fix "tatatata" al cerrar — quitar `if fullPlayerVisible` que
    # desmontaba/remontaba la vista durante la animacion; ahora siempre renderizada
    # cuando hay track (offset lo mueve fuera de pantalla cuando progress=0)
    # v1.2.29: Player Spotify-style — bottomNav se oculta progresivamente al abrir el
    # player (opacity + offset abajo) como Spotify. allowsHitTesting condicionado.
    # v1.2.28: Player — vuelve a salir desde fondo (peticion user), topBar pegado al
    # notch con solo 4pt de aire (no tan bajo), sin desperdiciar espacio vertical
    # v1.2.27: Player Spotify-style FIXED — safe area top notch, se levanta desde el
    # mini (no desde el fondo), spring optimizado sin lag, allowsHitTesting condicionado
    # v1.2.26: Player Spotify-style — drag continuo del mini→full siguiendo el dedo
    # v1.2.25: FIX critico - appendingPathComponent encodeaba ? como %3F rompiendo
    # todos los GET endpoints admin con query strings (audit_log, reports_queue, yt_search)
    # v1.2.24: Admin Tier 2+3 completo — merge tracks, boost, reassign album, edit genres,
    # edit bio, ban artist, force rehydrate, YT search+preview, import playlist,
    # audit log con rollback, reports queue moderation
    # v1.2.23: Admin acciones en TODAS las listas (Favoritos, Historial, Album, Playlist, Downloads,
    # Search artists) + botón "⋯" en headers artist/album + email whitelist auto-admin
    # v1.2.22: Admin mode para owners — reportar/reemplazar YT/editar meta/ocultar/importar
    # v1.2.21: VPS yt_proxy con cookie pool (Firefox owner) — YouTube LOGIN_REQUIRED bypaseado
    # v1.0.0-beta1: primer build de la app SEPARADA con offline mode
    # Bundle: es.temazo.app.beta (aparece como app aparte en el iPhone junto a la estable)
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: '-Onone'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'

targets:
  TemazoBeta:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Temazo
    resources:
      - path: Temazo/Resources
    # Info.plist mantenido manual (garantiza UIBackgroundModes audio siempre)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.temazo.app.beta
        PRODUCT_NAME: Temazo Beta
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_FILE: Temazo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Temazo Beta App Store Distribution
          DEVELOPMENT_TEAM: 4B8U4JJQ93
        Debug:
          CODE_SIGN_STYLE: Automatic
