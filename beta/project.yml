name: TemazoBeta
options:
  bundleIdPrefix: es.temazo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: '16.0'

settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: 4B8U4JJQ93
    MARKETING_VERSION: '1.2.30'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # v1.2.30: Player fix "tatatata" al cerrar — quitar `if fullPlayerVisible` que
    # desmontaba/remontaba la vista durante la animacion; ahora siempre renderizada
    # cuando hay track (offset lo mueve fuera de pantalla cuando progress=0)
    # v1.2.29: Player Spotify-style — bottomNav se oculta progresivamente al abrir el
    # player (opacity + offset abajo) como Spotify. allowsHitTesting condicionado.
    # v1.2.28: Player — vuelve a salir desde fondo (peticion user), topBar pegado al
    # notch con solo 4pt de aire (no tan bajo), sin desperdiciar espacio vertical
    # v1.2.27: Player Spotify-style FIXED — safe area top notch, se levanta desde el
    # mini (no desde el fondo), spring optimizado sin lag, allowsHitTesting condicionado
    # v1.2.26: Player Spotify-style — drag continuo del mini→full siguiendo el dedo
    # v1.2.25: FIX critico - appendingPathComponent encodeaba ? como %3F rompiendo
    # todos los GET endpoints admin con query strings (audit_log, reports_queue, yt_search)
    # v1.2.24: Admin Tier 2+3 completo — merge tracks, boost, reassign album, edit genres,
    # edit bio, ban artist, force rehydrate, YT search+preview, import playlist,
    # audit log con rollback, reports queue moderation
    # v1.2.23: Admin acciones en TODAS las listas (Favoritos, Historial, Album, Playlist, Downloads,
    # Search artists) + botón "⋯" en headers artist/album + email whitelist auto-admin
    # v1.2.22: Admin mode para owners — reportar/reemplazar YT/editar meta/ocultar/importar
    # v1.2.21: VPS yt_proxy con cookie pool (Firefox owner) — YouTube LOGIN_REQUIRED bypaseado
    # v1.0.0-beta1: primer build de la app SEPARADA con offline mode
    # Bundle: es.temazo.app.beta (aparece como app aparte en el iPhone junto a la estable)
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: '-Onone'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'

targets:
  TemazoBeta:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Temazo
    resources:
      - path: Temazo/Resources
    # Info.plist mantenido manual (garantiza UIBackgroundModes audio siempre)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.temazo.app.beta
        PRODUCT_NAME: Temazo Beta
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_FILE: Temazo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Temazo Beta App Store Distribution
          DEVELOPMENT_TEAM: 4B8U4JJQ93
        Debug:
          CODE_SIGN_STYLE: Automatic
